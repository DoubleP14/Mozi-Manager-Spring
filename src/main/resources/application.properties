spring.application.name=mozi-manager
server.port=8090

# Az adatbazis a development/docker/docker-compose.yaml alapjan
spring.datasource.url=jdbc:postgresql://localhost:5432/mozi
spring.datasource.username=mozi
spring.datasource.password=mozi

# A Vaadin admin felulet a /admin alatt fut, igy a /api a Svelte feluletnek marad
vaadin.url-mapping=/admin/*

# Megadjuk a dialektust, igy az alkalmazas adatbazis nelkul is elindul (pl. a build tesztjeinel)
spring.data.jdbc.dialect=postgresql
